[package]
name = "waterui-canvas"
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
authors = ["Lexo Liu <me@lexo.cool>"]
license = "Apache-2.0 OR MIT"
readme = "README.md"
repository = "https://github.com/water-rs/canvas"
description = "Canvas 2D vector graphics for WaterUI using Vello"
keywords = ["canvas", "2d", "graphics", "waterui", "vello"]
categories = ["gui"]

[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
multiple_crate_versions = "allow"

[features]
default = ["image"]
# Raster images on the canvas: `CanvasImage`, the `draw_image*` family and the
# `CanvasResource::Image` arm.
#
# Decoding goes through `waterui-graphics`'s `image_decode`, which that crate
# gates behind its `gpu` feature, so asking for images here is what pulls the
# whole wgpu stack in. Vector drawing needs none of it: a consumer that never
# draws a decoded image — a CPU-only renderer such as a dew firmware build —
# turns this feature off and links neither the codecs nor wgpu.
image = ["dep:image", "waterui-graphics/gpu"]

# The requirements below are the versions the pinned framework revision
# declares; they move to 0.5.0 when the `[patch.crates-io]` pins drop after the
# release. A "0.5.0" requirement cannot resolve before the wave is on
# crates.io — cargo checks a patch's declared version against the requirement.
[dependencies]
waterui-core = "0.3.2"
waterui-graphics = { version = "0.4.1", default-features = false }
nami = "0.11.2"
kurbo = "0.13"
peniko = "0.6"
parley = { version = "0.11", default-features = false, features = ["system"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff"], optional = true }

[dev-dependencies]
waterui = "0.4.1"
# The scene-engine test renders a canvas through a real GPU runtime, so the
# tests need the engine-backed half of the graphics crate even when the crate
# under test is built without it.
waterui-graphics = { version = "0.4.1", features = ["gpu"] }
waterui-testing = "0.4.1"
pollster = "1.0"
wgpu = "29.0.4"

# Until the 0.5.0 wave is on crates.io, every `waterui-*` crate the graph
# resolves comes from the framework's release-candidate revision — a registry
# copy beside its git twin would compile duplicate `View`/`Resolvable` types.
# `hydrolysis`/`hydrolysis-m3` are pulled in by `waterui-testing` and pin their
# `dev` HEADs the same way. Drop this table once the releases land.
[patch.crates-io]
waterui = { git = "https://github.com/water-rs/waterui", rev = "8a5c93a4f571db43713c26710336cc3b098d91f1" }
waterui-assets = { git = "https://github.com/water-rs/waterui", rev = "8a5c93a4f571db43713c26710336cc3b098d91f1" }
waterui-assets-core = { git = "https://github.com/water-rs/waterui", rev = "8a5c93a4f571db43713c26710336cc3b098d91f1" }
waterui-assets-macros = { git = "https://github.com/water-rs/waterui", rev = "8a5c93a4f571db43713c26710336cc3b098d91f1" }
waterui-assets-planner = { git = "https://github.com/water-rs/waterui", rev = "8a5c93a4f571db43713c26710336cc3b098d91f1" }
waterui-backend-core = { git = "https://github.com/water-rs/waterui", rev = "8a5c93a4f571db43713c26710336cc3b098d91f1" }
waterui-controls = { git = "https://github.com/water-rs/waterui", rev = "8a5c93a4f571db43713c26710336cc3b098d91f1" }
waterui-core = { git = "https://github.com/water-rs/waterui", rev = "8a5c93a4f571db43713c26710336cc3b098d91f1" }
waterui-dylib = { git = "https://github.com/water-rs/waterui", rev = "8a5c93a4f571db43713c26710336cc3b098d91f1" }
