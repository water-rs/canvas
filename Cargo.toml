[package]
name = "waterui-canvas"
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
authors = ["Lexo Liu <me@lexo.cool>"]
license = "Apache-2.0 OR MIT"
readme = "README.md"
repository = "https://github.com/water-rs/canvas"
description = "Canvas 2D vector graphics for WaterUI, recorded as Cherenkov content"
keywords = ["canvas", "2d", "graphics", "waterui", "cherenkov"]
categories = ["gui"]

[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
multiple_crate_versions = "allow"

[features]
default = ["image"]
# Raster images on the canvas: `CanvasImage`, the `draw_image*` family and the
# `CanvasResource::Image` arm.
#
# Decoding goes through `waterui-graphics`'s `image_decode`, which that crate
# gates behind its `gpu` feature, so asking for images here is what pulls the
# whole wgpu stack in. Vector drawing needs none of it: a consumer that never
# draws a decoded image — a CPU-only renderer such as a dew firmware build —
# turns this feature off and links neither the codecs nor wgpu.
image = ["dep:image", "waterui-graphics/gpu"]

# The requirements below are the versions the pinned framework revision
# declares; they move to 0.5.0 when the `[patch.crates-io]` pins drop after the
# release. A "0.5.0" requirement cannot resolve before the wave is on
# crates.io — cargo checks a patch's declared version against the requirement.
[dependencies]
waterui-core = "0.5.0"
waterui-graphics = { version = "0.5.0", default-features = false }
# Pinned to =0.11.1 so the [patch.crates-io] nami below (nami#26, `Signal::get`
# → `snapshot`) is the newest match — crates.io 0.11.2 still ships `get`.
nami = "=0.11.1"
# The rendering engine's front end: shapes, paints and the recorder the
# canvas replays into. Not on crates.io; the same rev as waterui pins.
cherenkov = { git = "https://github.com/water-rs/cherenkov", rev = "ce5c04f63e4e3303fc76421e61af0d45b0c4b336" }
parley = { version = "0.11", default-features = false, features = ["system"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff"], optional = true }

[dev-dependencies]
waterui = "0.5.0"
# The unit tests record through the raster engine so text and images get real
# resource handles without a GPU.
waterui-graphics = { version = "0.5.0", features = ["gpu", "cpu"] }
waterui-testing = "0.5.0"

# Third-party forks the framework itself patches; a registry dependency does
# not carry its own patch table, so they are repeated here so this graph
# resolves the same sources as water-rs/waterui `dev`.
[patch.crates-io]
xcb = { git = "https://github.com/rust-x-bindings/rust-xcb", rev = "ae3b2cd080e78173223038ccbebdc644eaf4a9ad" }

# The nami the framework pins (its `kurbo` feature carries Cherenkov's
# geometry as signal values); drop once released.
nami = { git = "https://github.com/water-rs/nami", rev = "6908aac816de14ee5aff23bfffd7d2b109d08fea" }
nami-core = { git = "https://github.com/water-rs/nami", rev = "6908aac816de14ee5aff23bfffd7d2b109d08fea" }

# The framework at its Cherenkov migration head (waterui#1246).
waterui = { git = "https://github.com/water-rs/waterui", rev = "6a8dcfa89af61d2634543899bbb4f6bdc0ee3abd" }
