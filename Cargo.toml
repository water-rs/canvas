[package]
name = "waterui-canvas"
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
authors = ["Lexo Liu <me@lexo.cool>"]
license = "Apache-2.0 OR MIT"
readme = "README.md"
repository = "https://github.com/water-rs/canvas"
description = "Canvas 2D vector graphics for WaterUI on the Cherenkov engine"
keywords = ["canvas", "2d", "graphics", "waterui", "cherenkov"]
categories = ["gui"]

[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
multiple_crate_versions = "allow"

[features]
default = ["image"]
# Raster images on the canvas: `CanvasImage`, the `draw_image*` family and the
# `CanvasResource::Image` arm.
#
# Decoding goes through `waterui-graphics`'s `image_decode`, which that crate
# gates behind its `gpu` feature, so asking for images here is what pulls the
# whole wgpu stack in. Vector drawing needs none of it: a consumer that never
# draws a decoded image — a CPU-only renderer such as a dew firmware build —
# turns this feature off and links neither the codecs nor wgpu.
image = ["dep:image", "waterui-graphics/gpu"]

# The requirements below are the versions the pinned framework revision
# declares; they move to 0.5.0 when the `[patch.crates-io]` pins drop after the
# release. A "0.5.0" requirement cannot resolve before the wave is on
# crates.io — cargo checks a patch's declared version against the requirement.
[dependencies]
waterui-core = "0.5.0"
waterui-graphics = { version = "0.5.0", default-features = false }
# `cherenkov = "0.0.0"` is the placeholder requirement the framework uses
# before the engine is published; the actual source comes from the
# [patch.crates-io] git rev below.
cherenkov = "0.0.0"
# Pinned to =0.11.1 so the [patch.crates-io] nami below (nami#26, `Signal::get`
# → `snapshot`) is the newest match — crates.io 0.11.2 still ships `get`.
nami = "=0.11.1"
kurbo = "0.13"
parley = { version = "0.11", default-features = false, features = ["system"] }
tracing = "0.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff"], optional = true }

[dev-dependencies]
# The scene-engine test renders a canvas through the Cherenkov GPU engine and
# the CPU raster engine, so the tests need the engine-backed half of the
# graphics crate even when the crate under test is built without it.
waterui-graphics = { version = "0.5.0", features = ["gpu", "cpu"] }
# The mounted end-to-end test exercises the real view mounting path and the
# accessibility tree; both come from the facade and its testing harness. Until
# the hydrolysis port lands they are the targets that do not build.
waterui = "0.5.0"
waterui-testing = "0.5.0"

# Third-party forks the framework itself patches; a registry dependency does
# not carry its own patch table, so the ones this graph resolves are repeated
# here so it builds the same sources as water-rs/waterui `dev`.
[patch.crates-io]
# nami#26 renames `Signal::get` to `Signal::snapshot`; drop once released.
nami = { git = "https://github.com/water-rs/nami", rev = "f1db5017f5d64cb45b9b304c74ff420377258476" }
nami-core = { git = "https://github.com/water-rs/nami", rev = "f1db5017f5d64cb45b9b304c74ff420377258476" }

# The Cherenkov engine this crate records into — pinned to the cutover rev;
# this overrides waterui's own pin (23d94a8a) in the shared graph.
cherenkov = { git = "https://github.com/water-rs/cherenkov", rev = "71fe47e2" }
cherenkov-cpu = { git = "https://github.com/water-rs/cherenkov", rev = "71fe47e2" }
cherenkov-gpu = { git = "https://github.com/water-rs/cherenkov", rev = "71fe47e2" }
cherenkov-shader = { git = "https://github.com/water-rs/cherenkov", rev = "71fe47e2" }
filtrate = { git = "https://github.com/water-rs/cherenkov", rev = "71fe47e2" }
filtrate-core = { git = "https://github.com/water-rs/cherenkov", rev = "71fe47e2" }
filtrate-derive = { git = "https://github.com/water-rs/cherenkov", rev = "71fe47e2" }

# The WaterUI crates this graph resolves, pinned to the cherenkov-cutover
# revision (branch feat/cherenkov-cutover-w).
waterui = { git = "https://github.com/water-rs/waterui", rev = "70689a022b94de909a7bed5e734f9b88aea2c9ee" }
waterui-assets = { git = "https://github.com/water-rs/waterui", rev = "70689a022b94de909a7bed5e734f9b88aea2c9ee" }
waterui-assets-core = { git = "https://github.com/water-rs/waterui", rev = "70689a022b94de909a7bed5e734f9b88aea2c9ee" }
waterui-assets-macros = { git = "https://github.com/water-rs/waterui", rev = "70689a022b94de909a7bed5e734f9b88aea2c9ee" }
waterui-assets-planner = { git = "https://github.com/water-rs/waterui", rev = "70689a022b94de909a7bed5e734f9b88aea2c9ee" }
waterui-backend-core = { git = "https://github.com/water-rs/waterui", rev = "70689a022b94de909a7bed5e734f9b88aea2c9ee" }
waterui-controls = { git = "https://github.com/water-rs/waterui", rev = "70689a022b94de909a7bed5e734f9b88aea2c9ee" }
waterui-core = { git = "https://github.com/water-rs/waterui", rev = "70689a022b94de909a7bed5e734f9b88aea2c9ee" }
waterui-dylib = { git = "https://github.com/water-rs/waterui", rev = "70689a022b94de909a7bed5e734f9b88aea2c9ee" }
waterui-form = { git = "https://github.com/water-rs/waterui", rev = "70689a022b94de909a7bed5e734f9b88aea2c9ee" }
waterui-graphics = { git = "https://github.com/water-rs/waterui", rev = "70689a022b94de909a7bed5e734f9b88aea2c9ee" }
waterui-icon = { git = "https://github.com/water-rs/waterui", rev = "70689a022b94de909a7bed5e734f9b88aea2c9ee" }
waterui-inspector-protocol = { git = "https://github.com/water-rs/waterui", rev = "70689a022b94de909a7bed5e734f9b88aea2c9ee" }
waterui-internal = { git = "https://github.com/water-rs/waterui", rev = "70689a022b94de909a7bed5e734f9b88aea2c9ee" }
waterui-layout = { git = "https://github.com/water-rs/waterui", rev = "70689a022b94de909a7bed5e734f9b88aea2c9ee" }
waterui-locale = { git = "https://github.com/water-rs/waterui", rev = "70689a022b94de909a7bed5e734f9b88aea2c9ee" }
waterui-macros = { git = "https://github.com/water-rs/waterui", rev = "70689a022b94de909a7bed5e734f9b88aea2c9ee" }
waterui-map = { git = "https://github.com/water-rs/waterui", rev = "70689a022b94de909a7bed5e734f9b88aea2c9ee" }
waterui-media = { git = "https://github.com/water-rs/waterui", rev = "70689a022b94de909a7bed5e734f9b88aea2c9ee" }
waterui-navigation = { git = "https://github.com/water-rs/waterui", rev = "70689a022b94de909a7bed5e734f9b88aea2c9ee" }
waterui-preview-protocol = { git = "https://github.com/water-rs/waterui", rev = "70689a022b94de909a7bed5e734f9b88aea2c9ee" }
waterui-shape = { git = "https://github.com/water-rs/waterui", rev = "70689a022b94de909a7bed5e734f9b88aea2c9ee" }
waterui-testing = { git = "https://github.com/water-rs/waterui", rev = "70689a022b94de909a7bed5e734f9b88aea2c9ee" }
waterui-text = { git = "https://github.com/water-rs/waterui", rev = "70689a022b94de909a7bed5e734f9b88aea2c9ee" }
waterui-url = { git = "https://github.com/water-rs/waterui", rev = "70689a022b94de909a7bed5e734f9b88aea2c9ee" }
waterui-video = { git = "https://github.com/water-rs/waterui", rev = "70689a022b94de909a7bed5e734f9b88aea2c9ee" }
waterui-watcher-set = { git = "https://github.com/water-rs/waterui", rev = "70689a022b94de909a7bed5e734f9b88aea2c9ee" }
waterui-webview = { git = "https://github.com/water-rs/waterui", rev = "70689a022b94de909a7bed5e734f9b88aea2c9ee" }

# waterui-testing mounts views through hydrolysis; the renderer's cherenkov
# port (W3) is in flight — this is waterui's own pin at the cutover rev.
hydrolysis = { git = "https://github.com/water-rs/hydrolysis", rev = "481c20cc44bb64a764f472a775af8a6714831712" }
# The svg crate's first cherenkov-ported revision; hydrolysis reaches it
# through the waterui facade's `gpu` feature.
waterui-svg = { git = "https://github.com/water-rs/svg", rev = "23462ac75ba7c5f9caf763eb3d85a2d4f3671ae3" }
# waterui-testing still draws through vello on the pinned waterui rev; match
# the forks waterui itself pins so the graph resolves the same sources.
vello = { git = "https://github.com/lexoliu/vello", rev = "76292095f408cf04b901023c2053f8d424652f06" }
vello_common = { git = "https://github.com/lexoliu/vello", rev = "a01e5039c290fa869e0f6f3708e621056740f49b" }
glifo = { git = "https://github.com/lexoliu/vello", rev = "a01e5039c290fa869e0f6f3708e621056740f49b" }

# The rest of the facade's transitive graph, at the revs waterui@70689a022's
