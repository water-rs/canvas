waterui-dylib = { git = "https://github.com/water-rs/waterui", rev = "46552dd30ef8fcd84b85b7003496d7b3e5606d3d" }
waterui-form = { git = "https://github.com/water-rs/waterui", rev = "46552dd30ef8fcd84b85b7003496d7b3e5606d3d" }
waterui-graphics = { git = "https://github.com/water-rs/waterui", rev = "46552dd30ef8fcd84b85b7003496d7b3e5606d3d" }
waterui-icon = { git = "https://github.com/water-rs/waterui", rev = "46552dd30ef8fcd84b85b7003496d7b3e5606d3d" }
waterui-inspector-protocol = { git = "https://github.com/water-rs/waterui", rev = "46552dd30ef8fcd84b85b7003496d7b3e5606d3d" }
waterui-internal = { git = "https://github.com/water-rs/waterui", rev = "46552dd30ef8fcd84b85b7003496d7b3e5606d3d" }
waterui-layout = { git = "https://github.com/water-rs/waterui", rev = "46552dd30ef8fcd84b85b7003496d7b3e5606d3d" }
waterui-locale = { git = "https://github.com/water-rs/waterui", rev = "46552dd30ef8fcd84b85b7003496d7b3e5606d3d" }
waterui-macros = { git = "https://github.com/water-rs/waterui", rev = "46552dd30ef8fcd84b85b7003496d7b3e5606d3d" }
waterui-map = { git = "https://github.com/water-rs/waterui", rev = "46552dd30ef8fcd84b85b7003496d7b3e5606d3d" }
waterui-media = { git = "https://github.com/water-rs/waterui", rev = "46552dd30ef8fcd84b85b7003496d7b3e5606d3d" }
waterui-navigation = { git = "https://github.com/water-rs/waterui", rev = "46552dd30ef8fcd84b85b7003496d7b3e5606d3d" }
waterui-preview-protocol = { git = "https://github.com/water-rs/waterui", rev = "46552dd30ef8fcd84b85b7003496d7b3e5606d3d" }
waterui-shape = { git = "https://github.com/water-rs/waterui", rev = "46552dd30ef8fcd84b85b7003496d7b3e5606d3d" }
waterui-testing = { git = "https://github.com/water-rs/waterui", rev = "46552dd30ef8fcd84b85b7003496d7b3e5606d3d" }
waterui-text = { git = "https://github.com/water-rs/waterui", rev = "46552dd30ef8fcd84b85b7003496d7b3e5606d3d" }
waterui-url = { git = "https://github.com/water-rs/waterui", rev = "46552dd30ef8fcd84b85b7003496d7b3e5606d3d" }
waterui-video = { git = "https://github.com/water-rs/waterui", rev = "46552dd30ef8fcd84b85b7003496d7b3e5606d3d" }
waterui-watcher-set = { git = "https://github.com/water-rs/waterui", rev = "46552dd30ef8fcd84b85b7003496d7b3e5606d3d" }
waterui-webview = { git = "https://github.com/water-rs/waterui", rev = "46552dd30ef8fcd84b85b7003496d7b3e5606d3d" }

# Extracted component crates at the revisions the framework's own patch
# table pins at 46552dd30; `waterui-canvas` itself is the local crate,
# patched at the top of the table.
waterui-barcode = { git = "https://github.com/water-rs/barcode", rev = "491ada1c7db31bdab657135338a5bd670adbe61f" }
waterui-chart = { git = "https://github.com/water-rs/chart", rev = "85f377be58ce12870c3817e16fc81fadcdf61233" }
waterui-image = { git = "https://github.com/water-rs/image", rev = "8b1aa2ce3f03d81ca02164f5563f2cefc34fb566" }
waterui-map-gpu = { git = "https://github.com/water-rs/map-gpu", rev = "759f907e2072c38616c85a928c6d95756883d20d" }
waterui-math = { git = "https://github.com/water-rs/math", rev = "765fb8bcd1e5dba30db973377ceabf12f9ed99f1" }
waterui-particle = { git = "https://github.com/water-rs/particle", rev = "ae7bcb7f5260b22723dcb5892fb28f5d776c03eb" }
waterui-svg = { git = "https://github.com/water-rs/svg", rev = "50a87217658e9cf40024bf50619c4d7555a6415b" }
waterui-video-gpu = { git = "https://github.com/water-rs/video-gpu", rev = "4f95775bcef3022e6d5a52c2aa09aee02afb628f" }

# The mounted test graph's backend pair at the revisions the framework's
# own patch table pins: `hydrolysis` lives in-tree at `backends/hydrolysis`
# (water-rs/waterui#1428), so it resolves from the same framework revision
# as every `waterui-*` crate; its Material 3 theme is still external and
# rides the rev the framework pins.
hydrolysis = { git = "https://github.com/water-rs/waterui", rev = "46552dd30ef8fcd84b85b7003496d7b3e5606d3d" }
hydrolysis-m3 = { git = "https://github.com/water-rs/hydrolysis-m3", rev = "cc8be840d96be39dc6f23aeace7310801d7a5f35" }

# nami#26 renames `Signal::get` to `Signal::snapshot`; drop once released.
nami = { git = "https://github.com/water-rs/nami", rev = "f1db5017f5d64cb45b9b304c74ff420377258476" }
nami-core = { git = "https://github.com/water-rs/nami", rev = "f1db5017f5d64cb45b9b304c74ff420377258476" }

# The Cherenkov cutover (water-rs/hydrolysis#205), now in-tree: the engine
# moved into water-rs/waterui under `graphics/` (water-rs/waterui#1449), and
# the stand-alone cherenkov repository is no longer the source. Its filtrate
# members are the filter library `.filter(F)`/`.effect(E)` and the engine
# agree on — every filtrate in the graph must come from this same revision
# or a filter built on one side is a different type on the other.
cherenkov = { git = "https://github.com/water-rs/waterui", rev = "46552dd30ef8fcd84b85b7003496d7b3e5606d3d" }
cherenkov-cpu = { git = "https://github.com/water-rs/waterui", rev = "46552dd30ef8fcd84b85b7003496d7b3e5606d3d" }
cherenkov-gpu = { git = "https://github.com/water-rs/waterui", rev = "46552dd30ef8fcd84b85b7003496d7b3e5606d3d" }
filtrate = { git = "https://github.com/water-rs/waterui", rev = "46552dd30ef8fcd84b85b7003496d7b3e5606d3d" }
filtrate-core = { git = "https://github.com/water-rs/waterui", rev = "46552dd30ef8fcd84b85b7003496d7b3e5606d3d" }
filtrate-derive = { git = "https://github.com/water-rs/waterui", rev = "46552dd30ef8fcd84b85b7003496d7b3e5606d3d" }

