[package]
name = "waterui-canvas"
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
authors = ["Lexo Liu <me@lexo.cool>"]
license = "Apache-2.0 OR MIT"
readme = "README.md"
repository = "https://github.com/water-rs/canvas"
description = "Canvas 2D vector graphics for WaterUI on the Cherenkov engine"
keywords = ["canvas", "2d", "graphics", "waterui", "cherenkov"]
categories = ["gui"]

[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
multiple_crate_versions = "allow"

[features]
default = ["image"]
# Raster images on the canvas: `CanvasImage`, the `draw_image*` family and the
# `CanvasResource::Image` arm.
#
# Decoding goes through `waterui-graphics`'s `image_decode`, which that crate
# gates behind its `gpu` feature, so asking for images here is what pulls the
# whole wgpu stack in. Vector drawing needs none of it: a consumer that never
# draws a decoded image — a CPU-only renderer such as a dew firmware build —
# turns this feature off and links neither the codecs nor wgpu.
image = ["dep:image", "waterui-graphics/gpu"]

# The requirements below are the versions the pinned framework revision
# declares; they move to 0.5.0 when the `[patch.crates-io]` pins drop after the
# release. A "0.5.0" requirement cannot resolve before the wave is on
# crates.io — cargo checks a patch's declared version against the requirement.
[dependencies]
waterui-core = "0.5.0"
waterui-graphics = { version = "0.5.0", default-features = false }
# `cherenkov = "0.0.0"` is the placeholder requirement the framework uses
# before the engine is published; the actual source comes from the
# [patch.crates-io] git rev below.
cherenkov = "0.0.0"
# Pinned to =0.11.1 so the [patch.crates-io] nami below (nami#26, `Signal::get`
# → `snapshot`) is the newest match — crates.io 0.11.2 still ships `get`.
nami = "=0.11.1"
kurbo = "0.13"
parley = { version = "0.11", default-features = false, features = ["system"] }
tracing = "0.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff"], optional = true }

[dev-dependencies]
# The scene-engine test renders a canvas through the Cherenkov GPU engine and
# the CPU raster engine, so the tests need the engine-backed half of the
# graphics crate even when the crate under test is built without it.
waterui-graphics = { version = "0.5.0", features = ["gpu", "cpu"] }
# The mounted end-to-end test exercises the real view mounting path and the
# accessibility tree; both come from the facade and its testing harness. Until
# the hydrolysis port lands they are the targets that do not build.
waterui = "0.5.0"
waterui-testing = "0.5.0"

# Third-party forks the framework itself patches; a registry dependency does
# not carry its own patch table, so the ones this graph resolves are repeated
# here so it builds the same sources as water-rs/waterui `dev`.
[patch.crates-io]
waterui-canvas = { path = "." }
waterkit-codec = { git = "https://github.com/water-rs/waterkit", rev = "2f1e359284b7d1f06f47689fac9a4677753b586b" }
# The WaterUI crates this graph resolves to the sibling checkout of the
# cutover working set (round 4, waterui 8fd2a851f) plus the interim component
# ports; mirrors the patch table hydrolysis applies as the graph root.
xcb = { git = "https://github.com/rust-x-bindings/rust-xcb", rev = "ae3b2cd080e78173223038ccbebdc644eaf4a9ad" }

# Framework crates pinned so the graph resolves a single nami Signal trait.
nami = { git = "https://github.com/water-rs/nami", rev = "f1db5017f5d64cb45b9b304c74ff420377258476" }
nami-core = { git = "https://github.com/water-rs/nami", rev = "f1db5017f5d64cb45b9b304c74ff420377258476" }
waterui-assets = { path = "../waterui/components/assets/runtime" }
waterui-assets-core = { path = "../waterui/components/assets/core" }
waterui-assets-macros = { path = "../waterui/components/assets/macros" }
waterui-assets-planner = { path = "../waterui/components/assets/planner" }
waterui-backend-core = { path = "../waterui/backends/core" }
waterui-controls = { path = "../waterui/components/foundation/controls" }
waterui-core = { path = "../waterui/core" }
waterui-dylib = { path = "../waterui/utils/dylib" }
waterui-form = { path = "../waterui/components/foundation/form" }
waterui-graphics = { path = "../waterui/components/visual/graphics" }
waterui-icon = { path = "../waterui/components/foundation/icon" }
waterui-inspector-protocol = { path = "../waterui/components/devtools/inspector/protocol" }
waterui-internal = { path = "../waterui/src" }
waterui-layout = { path = "../waterui/components/foundation/layout" }
waterui-locale = { path = "../waterui/utils/locale" }
waterui-macros = { path = "../waterui/macros" }
waterui-map = { path = "../waterui/components/data/map" }
waterui-media = { path = "../waterui/components/multimedia/media" }
waterui-navigation = { path = "../waterui/components/foundation/navigation" }
waterui-preview-protocol = { path = "../waterui/components/devtools/preview/protocol" }
waterui-shape = { path = "../waterui/components/foundation/shape" }
# waterui-testing is the member the cutover testing fix lives on; the sibling
# checkout carries it ahead of any published rev.
waterui-testing = { path = "../waterui/testing" }
waterui-text = { path = "../waterui/components/foundation/text" }
waterui-url = { path = "../waterui/utils/url" }
waterui-video = { path = "../waterui/components/multimedia/video" }
waterui-watcher-set = { path = "../waterui/utils/watcher-set" }
waterui-webview = { path = "../waterui/components/platform/webview" }
waterkit-core = { git = "https://github.com/water-rs/waterkit", rev = "2f1e359284b7d1f06f47689fac9a4677753b586b" }
waterkit-build = { git = "https://github.com/water-rs/waterkit", rev = "2f1e359284b7d1f06f47689fac9a4677753b586b" }
waterkit-clipboard = { git = "https://github.com/water-rs/waterkit", rev = "2f1e359284b7d1f06f47689fac9a4677753b586b" }
waterkit-dialog = { git = "https://github.com/water-rs/waterkit", rev = "2f1e359284b7d1f06f47689fac9a4677753b586b" }
waterkit-fs = { git = "https://github.com/water-rs/waterkit", rev = "2f1e359284b7d1f06f47689fac9a4677753b586b" }
waterkit-location = { git = "https://github.com/water-rs/waterkit", rev = "2f1e359284b7d1f06f47689fac9a4677753b586b" }
waterkit-permission = { git = "https://github.com/water-rs/waterkit", rev = "2f1e359284b7d1f06f47689fac9a4677753b586b" }
hydrolysis = { path = "../hydrolysis" }
hydrolysis-m3 = { path = "../hydrolysis-m3" }
waterui = { path = "../waterui/." }

# --- Cherenkov cutover (water-rs/hydrolysis#205): interim pins -------------
# Same set hydrolysis's root applies: the test graph pulls hydrolysis (path,
# above), whose cherenkov/filtrate revision must be the one WaterUI round 4
# (8fd2a851f) pins or recorder types split into two copies.
cherenkov = { git = "https://github.com/water-rs/cherenkov", rev = "8d00976e5a68f3ac2e99d9265d3246b1a7c29ad6" }
cherenkov-cpu = { git = "https://github.com/water-rs/cherenkov", rev = "8d00976e5a68f3ac2e99d9265d3246b1a7c29ad6" }
cherenkov-gpu = { git = "https://github.com/water-rs/cherenkov", rev = "8d00976e5a68f3ac2e99d9265d3246b1a7c29ad6" }
filtrate = { git = "https://github.com/water-rs/cherenkov", rev = "8d00976e5a68f3ac2e99d9265d3246b1a7c29ad6" }
filtrate-core = { git = "https://github.com/water-rs/cherenkov", rev = "8d00976e5a68f3ac2e99d9265d3246b1a7c29ad6" }
filtrate-derive = { git = "https://github.com/water-rs/cherenkov", rev = "8d00976e5a68f3ac2e99d9265d3246b1a7c29ad6" }
shaderloom = { git = "https://github.com/water-rs/shaderloom", rev = "fec1801849979239097cabbf2ad813e56a91132d" }
# Component crates with no published rev against the r4 scene contract:
# sibling checkouts carry the mechanical interim ports.
waterui-svg = { path = "../svg" }
waterui-image = { path = "../image" }
waterui-video-gpu = { path = "../video-gpu" }
waterui-chart = { git = "https://github.com/water-rs/chart", rev = "ff481c3d319b7d025a1fa0c1dcdb283f92be9689" }
waterui-barcode = { git = "https://github.com/water-rs/barcode", rev = "4c530503f6e3277f44511f327db463a195482abd" }
waterui-map-gpu = { git = "https://github.com/water-rs/map-gpu", rev = "13e199d255a11637e03341e0a947447851eff85e" }
waterui-particle = { git = "https://github.com/water-rs/particle", rev = "e27ae84666ee58c2ff4adae16d9227baf7efc3f2" }
waterui-math = { git = "https://github.com/water-rs/math", rev = "f59cc09fd27f2000d36225e72662a653b5751182" }
