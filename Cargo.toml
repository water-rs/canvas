[package]
name = "waterui-canvas"
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
authors = ["Lexo Liu <me@lexo.cool>"]
license = "Apache-2.0 OR MIT"
readme = "README.md"
repository = "https://github.com/water-rs/canvas"
description = "Canvas 2D vector graphics for WaterUI on the Cherenkov engine"
keywords = ["canvas", "2d", "graphics", "waterui", "cherenkov"]
categories = ["gui"]

[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
multiple_crate_versions = "allow"

[features]
default = ["image"]
# Raster images on the canvas: `CanvasImage`, the `draw_image*` family and the
# `CanvasResource::Image` arm.
#
# Decoding goes through `waterui-graphics`'s `image_decode`, which that crate
# gates behind its `gpu` feature, so asking for images here is what pulls the
# whole wgpu stack in. Vector drawing needs none of it: a consumer that never
# draws a decoded image — a CPU-only renderer such as a dew firmware build —
# turns this feature off and links neither the codecs nor wgpu.
image = ["dep:image", "waterui-graphics/gpu"]

# The requirements below are the versions the patched framework branch
# declares; they move to 0.5.x when the `[patch.crates-io]` pins drop after the
# release. A lower requirement cannot resolve to a newer patch — cargo checks
# a patch's declared version against the requirement.
[dependencies]
waterui-core = "0.5.1"
waterui-graphics = { version = "0.5.1", default-features = false }
nami = "0.13"
kurbo = "0.13"
parley = { version = "0.11", default-features = false, features = ["system"] }
tracing = "0.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff"], optional = true }

[dev-dependencies]
# The scene-engine test renders a canvas through the Cherenkov GPU engine and
# the CPU raster engine, so the tests need the engine-backed half of the
# graphics crate even when the crate under test is built without it.
waterui-graphics = { version = "0.5.1", features = ["gpu", "cpu"] }
# The mounted end-to-end test exercises the real view mounting path and the
# accessibility tree; both come from the facade and its testing harness. Until
# the hydrolysis port lands they are the targets that do not build.
waterui = "0.5.2"
waterui-testing = "0.5.1"

[patch.crates-io]
# The crate under test stands in for the published `waterui-canvas` the facade
# and testing harness ask for.
waterui-canvas = { path = "." }

# Third-party forks the framework itself patches; a registry dependency does
# not carry its own patch table, so the ones this graph resolves are repeated
# here so it builds the same sources as water-rs/waterui on the branch below.
xcb = { git = "https://github.com/rust-x-bindings/rust-xcb", rev = "ae3b2cd080e78173223038ccbebdc644eaf4a9ad" }
block = { git = "https://github.com/Dicklesworthstone/rust-block", rev = "b39ae859d1ee8e8cb5eef6a516471f1578d26b96" }

# The framework the crate builds against: water-rs/waterui on
# `feat/2633-nami-0.13`, which moves the framework to nami 0.13 / nami-core
# 0.5 (water-rs/waterui#2633), with the exact commit recorded in
# `Cargo.lock`. It carries the render-target-neutral recording contract
# (water-rs/waterui#1435):
# `SceneContent::build_scene` records into `waterui_graphics::draw`
# (`cherenkov_record::Recorder`) and `SceneResources::new` takes the target's
# `SceneBackend`/`ShaderBackend` registry instead of `Rc<Engine<B>>`. Every
# `waterui-*` crate in the graph must resolve to this one commit — a registry
# `waterui-core` beside the facade's own path dependencies gives two `View`
# traits in one graph.
waterui = { git = "https://github.com/water-rs/waterui", branch = "feat/2633-nami-0.13" }
waterui-assets = { git = "https://github.com/water-rs/waterui", branch = "feat/2633-nami-0.13" }
waterui-assets-core = { git = "https://github.com/water-rs/waterui", branch = "feat/2633-nami-0.13" }
waterui-assets-macros = { git = "https://github.com/water-rs/waterui", branch = "feat/2633-nami-0.13" }
waterui-assets-planner = { git = "https://github.com/water-rs/waterui", branch = "feat/2633-nami-0.13" }
waterui-backend-core = { git = "https://github.com/water-rs/waterui", branch = "feat/2633-nami-0.13" }
waterui-controls = { git = "https://github.com/water-rs/waterui", branch = "feat/2633-nami-0.13" }
waterui-core = { git = "https://github.com/water-rs/waterui", branch = "feat/2633-nami-0.13" }
waterui-dylib = { git = "https://github.com/water-rs/waterui", branch = "feat/2633-nami-0.13" }
waterui-form = { git = "https://github.com/water-rs/waterui", branch = "feat/2633-nami-0.13" }
waterui-graphics = { git = "https://github.com/water-rs/waterui", branch = "feat/2633-nami-0.13" }
waterui-icon = { git = "https://github.com/water-rs/waterui", branch = "feat/2633-nami-0.13" }
waterui-inspector-protocol = { git = "https://github.com/water-rs/waterui", branch = "feat/2633-nami-0.13" }
waterui-internal = { git = "https://github.com/water-rs/waterui", branch = "feat/2633-nami-0.13" }
waterui-layout = { git = "https://github.com/water-rs/waterui", branch = "feat/2633-nami-0.13" }
waterui-locale = { git = "https://github.com/water-rs/waterui", branch = "feat/2633-nami-0.13" }
waterui-macros = { git = "https://github.com/water-rs/waterui", branch = "feat/2633-nami-0.13" }
waterui-map = { git = "https://github.com/water-rs/waterui", branch = "feat/2633-nami-0.13" }
waterui-media = { git = "https://github.com/water-rs/waterui", branch = "feat/2633-nami-0.13" }
waterui-navigation = { git = "https://github.com/water-rs/waterui", branch = "feat/2633-nami-0.13" }
waterui-preview-protocol = { git = "https://github.com/water-rs/waterui", branch = "feat/2633-nami-0.13" }
waterui-shape = { git = "https://github.com/water-rs/waterui", branch = "feat/2633-nami-0.13" }
waterui-testing = { git = "https://github.com/water-rs/waterui", branch = "feat/2633-nami-0.13" }
waterui-text = { git = "https://github.com/water-rs/waterui", branch = "feat/2633-nami-0.13" }
waterui-url = { git = "https://github.com/water-rs/waterui", branch = "feat/2633-nami-0.13" }
waterui-video = { git = "https://github.com/water-rs/waterui", branch = "feat/2633-nami-0.13" }
waterui-watcher-set = { git = "https://github.com/water-rs/waterui", branch = "feat/2633-nami-0.13" }
waterui-webview = { git = "https://github.com/water-rs/waterui", branch = "feat/2633-nami-0.13" }

# Extracted component crates. The ones moving to nami 0.13 alongside this
# crate (barcode, chart, map-gpu, math, video-gpu) ride their own
# `feat/nami-0.13` branches, since the revisions the framework's table names
# are still on nami 0.12; image, particle and svg ride the revisions the
# framework's own patch table pins. `waterui-canvas` itself is the local
# crate, patched at the top of the table.
waterui-barcode = { git = "https://github.com/water-rs/barcode", branch = "feat/nami-0.13" }
waterui-chart = { git = "https://github.com/water-rs/chart", branch = "feat/nami-0.13" }
waterui-image = { git = "https://github.com/water-rs/image", rev = "a36e16c555bd78ade9e28fad947af66a52f8f071" }
waterui-map-gpu = { git = "https://github.com/water-rs/map-gpu", branch = "feat/nami-0.13" }
waterui-math = { git = "https://github.com/water-rs/math", branch = "feat/nami-0.13" }
waterui-particle = { git = "https://github.com/water-rs/particle", rev = "bf663af85211d1f0bcce511b94ac435efad046a6" }
waterui-svg = { git = "https://github.com/water-rs/svg", rev = "16f99e021f735d0b1b31c95552b074e953d56418" }
waterui-video-gpu = { git = "https://github.com/water-rs/video-gpu", branch = "feat/nami-0.13" }

# The mounted test graph's backend pair from the sources the framework's
# own patch table names: `hydrolysis` lives in-tree at `backends/hydrolysis`
# (water-rs/waterui#1428), so it resolves from the same framework commit
# as every `waterui-*` crate; its Material 3 theme is still external and
# follows its `dev`, as the framework's does.
hydrolysis = { git = "https://github.com/water-rs/waterui", branch = "feat/2633-nami-0.13" }
hydrolysis-m3 = { git = "https://github.com/water-rs/hydrolysis-m3", branch = "dev" }

# suiteki 0.1.1 on crates.io implements nami-core 0.3's `Signal`; suiteki's
# `dev` implements 0.5's (water-rs/suiteki#29), the source the framework's own
# patch table names. Drop once a release carries it.
suiteki = { git = "https://github.com/water-rs/suiteki", branch = "dev" }

# The Cherenkov cutover (water-rs/hydrolysis#205), now in-tree: the engine
# moved into water-rs/waterui under `graphics/` (water-rs/waterui#1449), and
# the stand-alone cherenkov repository is no longer the source. Its filtrate
# members are the filter library `.filter(F)`/`.effect(E)` and the engine
# agree on — every filtrate in the graph must come from this same commit
# or a filter built on one side is a different type on the other.
cherenkov = { git = "https://github.com/water-rs/waterui", branch = "feat/2633-nami-0.13" }
cherenkov-cpu = { git = "https://github.com/water-rs/waterui", branch = "feat/2633-nami-0.13" }
cherenkov-gpu = { git = "https://github.com/water-rs/waterui", branch = "feat/2633-nami-0.13" }
filtrate = { git = "https://github.com/water-rs/waterui", branch = "feat/2633-nami-0.13" }
filtrate-core = { git = "https://github.com/water-rs/waterui", branch = "feat/2633-nami-0.13" }
filtrate-derive = { git = "https://github.com/water-rs/waterui", branch = "feat/2633-nami-0.13" }

# Every waterkit crate the codec graph shares types across rides the same
# commit — a registry `waterkit-core` beside the patched `waterkit-codec` gives
# two decoder types. The source is waterkit's `dev`, the one the framework's
# own patch table names; `Cargo.lock` records the exact commit.
waterkit-audio = { git = "https://github.com/water-rs/waterkit", branch = "dev" }
waterkit-build = { git = "https://github.com/water-rs/waterkit", branch = "dev" }
waterkit-camera = { git = "https://github.com/water-rs/waterkit", branch = "dev" }
waterkit-clipboard = { git = "https://github.com/water-rs/waterkit", branch = "dev" }
waterkit-codec = { git = "https://github.com/water-rs/waterkit", branch = "dev" }
waterkit-core = { git = "https://github.com/water-rs/waterkit", branch = "dev" }
waterkit-dialog = { git = "https://github.com/water-rs/waterkit", branch = "dev" }
waterkit-fs = { git = "https://github.com/water-rs/waterkit", branch = "dev" }
waterkit-haptic = { git = "https://github.com/water-rs/waterkit", branch = "dev" }
waterkit-location = { git = "https://github.com/water-rs/waterkit", branch = "dev" }
waterkit-permission = { git = "https://github.com/water-rs/waterkit", branch = "dev" }
waterkit-screen = { git = "https://github.com/water-rs/waterkit", branch = "dev" }
waterkit-video = { git = "https://github.com/water-rs/waterkit", branch = "dev" }
waterkit-video-container = { git = "https://github.com/water-rs/waterkit", branch = "dev" }
waterkit-video-core = { git = "https://github.com/water-rs/waterkit", branch = "dev" }
waterkit-video-player = { git = "https://github.com/water-rs/waterkit", branch = "dev" }
waterkit-video-streaming = { git = "https://github.com/water-rs/waterkit", branch = "dev" }

# Mirrored from the in-tree cherenkov workspace patch (water-rs/cherenkov#229,
# carried into water-rs/waterui).
# wgpu 30.0.1's Metal backend reads the address of the kCGColorSpace* globals
# instead of their value and crashes in CGColorSpaceCreateWithName whenever a
# surface negotiates Extended Display P3 or BT.2100 (gfx-rs/wgpu#10175, fixed on
# trunk, not yet released for v30). The fork carries only that backport on the
# v30.0.1 tag; drop these entries once wgpu-hal 30.0.2 ships it.
naga = { git = "https://github.com/water-rs/wgpu", rev = "11e85956a78886d1a96d586f255ea9b0661da2cd" }
naga-types = { git = "https://github.com/water-rs/wgpu", rev = "11e85956a78886d1a96d586f255ea9b0661da2cd" }
wgpu = { git = "https://github.com/water-rs/wgpu", rev = "11e85956a78886d1a96d586f255ea9b0661da2cd" }
wgpu-core = { git = "https://github.com/water-rs/wgpu", rev = "11e85956a78886d1a96d586f255ea9b0661da2cd" }
wgpu-core-deps-apple = { git = "https://github.com/water-rs/wgpu", rev = "11e85956a78886d1a96d586f255ea9b0661da2cd" }
wgpu-core-deps-emscripten = { git = "https://github.com/water-rs/wgpu", rev = "11e85956a78886d1a96d586f255ea9b0661da2cd" }
wgpu-core-deps-wasm = { git = "https://github.com/water-rs/wgpu", rev = "11e85956a78886d1a96d586f255ea9b0661da2cd" }
wgpu-core-deps-windows-linux-android = { git = "https://github.com/water-rs/wgpu", rev = "11e85956a78886d1a96d586f255ea9b0661da2cd" }
wgpu-hal = { git = "https://github.com/water-rs/wgpu", rev = "11e85956a78886d1a96d586f255ea9b0661da2cd" }
wgpu-naga-bridge = { git = "https://github.com/water-rs/wgpu", rev = "11e85956a78886d1a96d586f255ea9b0661da2cd" }
wgpu-types = { git = "https://github.com/water-rs/wgpu", rev = "11e85956a78886d1a96d586f255ea9b0661da2cd" }
