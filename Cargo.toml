waterui-map = { git = "https://github.com/water-rs/waterui", rev = "f3576aaf1610d3ee077538e741dfa8bb896b9b9e" }
waterui-media = { git = "https://github.com/water-rs/waterui", rev = "f3576aaf1610d3ee077538e741dfa8bb896b9b9e" }
waterui-navigation = { git = "https://github.com/water-rs/waterui", rev = "f3576aaf1610d3ee077538e741dfa8bb896b9b9e" }
waterui-preview-protocol = { git = "https://github.com/water-rs/waterui", rev = "f3576aaf1610d3ee077538e741dfa8bb896b9b9e" }
waterui-shape = { git = "https://github.com/water-rs/waterui", rev = "f3576aaf1610d3ee077538e741dfa8bb896b9b9e" }
waterui-testing = { git = "https://github.com/water-rs/waterui", rev = "f3576aaf1610d3ee077538e741dfa8bb896b9b9e" }
waterui-text = { git = "https://github.com/water-rs/waterui", rev = "f3576aaf1610d3ee077538e741dfa8bb896b9b9e" }
waterui-url = { git = "https://github.com/water-rs/waterui", rev = "f3576aaf1610d3ee077538e741dfa8bb896b9b9e" }
waterui-video = { git = "https://github.com/water-rs/waterui", rev = "f3576aaf1610d3ee077538e741dfa8bb896b9b9e" }
waterui-watcher-set = { git = "https://github.com/water-rs/waterui", rev = "f3576aaf1610d3ee077538e741dfa8bb896b9b9e" }
waterui-webview = { git = "https://github.com/water-rs/waterui", rev = "f3576aaf1610d3ee077538e741dfa8bb896b9b9e" }

# Extracted component crates at the revisions w3-r7's own lock carries;
# waterui-svg and waterui-image are the scene-resource port heads (the
# framework's own pinned revs do not compile against this API).
waterui-barcode = { git = "https://github.com/water-rs/barcode", rev = "4c530503f6e3277f44511f327db463a195482abd" }
waterui-chart = { git = "https://github.com/water-rs/chart", rev = "ff481c3d319b7d025a1fa0c1dcdb283f92be9689" }
waterui-image = { git = "https://github.com/water-rs/image", rev = "27ab17cad98e8b08f50d9df5a66d9ec11529a69f" }
waterui-map-gpu = { git = "https://github.com/water-rs/map-gpu", rev = "13e199d255a11637e03341e0a947447851eff85e" }
waterui-math = { git = "https://github.com/water-rs/math", rev = "f59cc09fd27f2000d36225e72662a653b5751182" }
waterui-particle = { git = "https://github.com/water-rs/particle", rev = "e27ae84666ee58c2ff4adae16d9227baf7efc3f2" }
waterui-svg = { git = "https://github.com/water-rs/svg", rev = "d53a94b03236718c9ee506bd9f5b4b1d2f247a8b" }
waterui-video-gpu = { git = "https://github.com/water-rs/video-gpu", rev = "01f3d3fc2907065eff815f623ac7d9e12fa9943b" }

# The mounted test graph's backend pair, at their Cherenkov r5 cutover heads:
# registry hydrolysis still calls the pre-recorder `Scene2D` API.
hydrolysis = { git = "https://github.com/water-rs/hydrolysis", rev = "2da1ec959f2a27c5a9860457ff7f505ee183861c" }
hydrolysis-m3 = { git = "https://github.com/water-rs/hydrolysis-m3", rev = "f04ec615ffd9d844876c97eb780befe3176d57e3" }

# nami#26 renames `Signal::get` to `Signal::snapshot`; drop once released.
nami = { git = "https://github.com/water-rs/nami", rev = "f1db5017f5d64cb45b9b304c74ff420377258476" }
nami-core = { git = "https://github.com/water-rs/nami", rev = "f1db5017f5d64cb45b9b304c74ff420377258476" }

# The Cherenkov cutover (water-rs/hydrolysis#205): the engine revision w3-r7
# pins. Its filtrate members are the filter library `.filter(F)`/`.effect(E)`
# and the engine agree on — every filtrate in the graph must come from this
# same revision or a filter built on one side is a different type on the
# other.
cherenkov = { git = "https://github.com/water-rs/cherenkov", rev = "8d00976e5a68f3ac2e99d9265d3246b1a7c29ad6" }
cherenkov-cpu = { git = "https://github.com/water-rs/cherenkov", rev = "8d00976e5a68f3ac2e99d9265d3246b1a7c29ad6" }
cherenkov-gpu = { git = "https://github.com/water-rs/cherenkov", rev = "8d00976e5a68f3ac2e99d9265d3246b1a7c29ad6" }
filtrate = { git = "https://github.com/water-rs/cherenkov", rev = "8d00976e5a68f3ac2e99d9265d3246b1a7c29ad6" }
filtrate-core = { git = "https://github.com/water-rs/cherenkov", rev = "8d00976e5a68f3ac2e99d9265d3246b1a7c29ad6" }
filtrate-derive = { git = "https://github.com/water-rs/cherenkov", rev = "8d00976e5a68f3ac2e99d9265d3246b1a7c29ad6" }

