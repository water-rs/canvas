[package]
name = "waterui-canvas"
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
authors = ["Lexo Liu <me@lexo.cool>"]
license = "Apache-2.0 OR MIT"
readme = "README.md"
repository = "https://github.com/water-rs/canvas"
description = "Canvas 2D vector graphics for WaterUI on the Cherenkov engine"
keywords = ["canvas", "2d", "graphics", "waterui", "cherenkov"]
categories = ["gui"]

[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
multiple_crate_versions = "allow"

[features]
default = ["image"]
# Raster images on the canvas: `CanvasImage`, the `draw_image*` family and the
# `CanvasResource::Image` arm.
#
# Decoding goes through `waterui-graphics`'s `image_decode`, which that crate
# gates behind its `gpu` feature, so asking for images here is what pulls the
# whole wgpu stack in. Vector drawing needs none of it: a consumer that never
# draws a decoded image — a CPU-only renderer such as a dew firmware build —
# turns this feature off and links neither the codecs nor wgpu.
image = ["dep:image", "waterui-graphics/gpu"]

# The requirements below are the versions the pinned framework revision
# declares; they move to 0.5.x when the `[patch.crates-io]` pins drop after the
# release. A lower requirement cannot resolve to a newer patch — cargo checks
# a patch's declared version against the requirement.
[dependencies]
waterui-core = "0.5.1"
waterui-graphics = { version = "0.5.1", default-features = false }
# `cherenkov = "0.0.0"` is the placeholder requirement the framework uses
# before the engine is published; the actual source comes from the
# [patch.crates-io] git rev below.
cherenkov = "0.0.0"
# Pinned to =0.11.1 so the [patch.crates-io] nami below (nami#26, `Signal::get`
# → `snapshot`) is the newest match — crates.io 0.11.2 still ships `get`.
nami = "=0.11.1"
kurbo = "0.13"
parley = { version = "0.11", default-features = false, features = ["system"] }
tracing = "0.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff"], optional = true }

[dev-dependencies]
# The scene-engine test renders a canvas through the Cherenkov GPU engine and
# the CPU raster engine, so the tests need the engine-backed half of the
# graphics crate even when the crate under test is built without it.
waterui-graphics = { version = "0.5.1", features = ["gpu", "cpu"] }
# The mounted end-to-end test exercises the real view mounting path and the
# accessibility tree; both come from the facade and its testing harness. Until
# the hydrolysis port lands they are the targets that do not build.
waterui = "0.5.2"
waterui-testing = "0.5.1"

# Third-party forks the framework itself patches; a registry dependency does
# not carry its own patch table, so the ones this graph resolves are repeated
# here so it builds the same sources as water-rs/waterui `dev`.
[patch.crates-io]
# The crate under test stands in for the published `waterui-canvas` the facade
# and testing harness ask for.
waterui-canvas = { path = "." }

# Third-party forks the framework itself patches; a registry dependency does
# not carry its own patch table, so the ones this graph resolves are repeated
# here so it builds the same sources as water-rs/waterui at the pinned rev.
xcb = { git = "https://github.com/rust-x-bindings/rust-xcb", rev = "ae3b2cd080e78173223038ccbebdc644eaf4a9ad" }
block = { git = "https://github.com/Dicklesworthstone/rust-block", rev = "b39ae859d1ee8e8cb5eef6a516471f1578d26b96" }

# The framework head the port builds against: water-rs/waterui at 4dacae48 —
# the merge that brought Cherenkov and the filtrate family in-tree
# (water-rs/waterui#1449), on top of the `SceneContent` engine-recovery
# contract (water-rs/waterui#1411). Every `waterui-*` crate in the graph must
# resolve to this one rev — a registry `waterui-core` beside the facade's own
# path dependencies gives two `View` traits in one graph.
waterui = { git = "https://github.com/water-rs/waterui", rev = "4dacae48908d6ad820d57a1ae25794231f77e74b" }
waterui-assets = { git = "https://github.com/water-rs/waterui", rev = "4dacae48908d6ad820d57a1ae25794231f77e74b" }
waterui-assets-core = { git = "https://github.com/water-rs/waterui", rev = "4dacae48908d6ad820d57a1ae25794231f77e74b" }
waterui-assets-macros = { git = "https://github.com/water-rs/waterui", rev = "4dacae48908d6ad820d57a1ae25794231f77e74b" }
waterui-assets-planner = { git = "https://github.com/water-rs/waterui", rev = "4dacae48908d6ad820d57a1ae25794231f77e74b" }
waterui-backend-core = { git = "https://github.com/water-rs/waterui", rev = "4dacae48908d6ad820d57a1ae25794231f77e74b" }
waterui-controls = { git = "https://github.com/water-rs/waterui", rev = "4dacae48908d6ad820d57a1ae25794231f77e74b" }
waterui-core = { git = "https://github.com/water-rs/waterui", rev = "4dacae48908d6ad820d57a1ae25794231f77e74b" }
waterui-dylib = { git = "https://github.com/water-rs/waterui", rev = "4dacae48908d6ad820d57a1ae25794231f77e74b" }
waterui-form = { git = "https://github.com/water-rs/waterui", rev = "4dacae48908d6ad820d57a1ae25794231f77e74b" }
waterui-graphics = { git = "https://github.com/water-rs/waterui", rev = "4dacae48908d6ad820d57a1ae25794231f77e74b" }
waterui-icon = { git = "https://github.com/water-rs/waterui", rev = "4dacae48908d6ad820d57a1ae25794231f77e74b" }
waterui-inspector-protocol = { git = "https://github.com/water-rs/waterui", rev = "4dacae48908d6ad820d57a1ae25794231f77e74b" }
waterui-internal = { git = "https://github.com/water-rs/waterui", rev = "4dacae48908d6ad820d57a1ae25794231f77e74b" }
waterui-layout = { git = "https://github.com/water-rs/waterui", rev = "4dacae48908d6ad820d57a1ae25794231f77e74b" }
waterui-locale = { git = "https://github.com/water-rs/waterui", rev = "4dacae48908d6ad820d57a1ae25794231f77e74b" }
waterui-macros = { git = "https://github.com/water-rs/waterui", rev = "4dacae48908d6ad820d57a1ae25794231f77e74b" }
waterui-map = { git = "https://github.com/water-rs/waterui", rev = "4dacae48908d6ad820d57a1ae25794231f77e74b" }
waterui-media = { git = "https://github.com/water-rs/waterui", rev = "4dacae48908d6ad820d57a1ae25794231f77e74b" }
waterui-navigation = { git = "https://github.com/water-rs/waterui", rev = "4dacae48908d6ad820d57a1ae25794231f77e74b" }
waterui-preview-protocol = { git = "https://github.com/water-rs/waterui", rev = "4dacae48908d6ad820d57a1ae25794231f77e74b" }
waterui-shape = { git = "https://github.com/water-rs/waterui", rev = "4dacae48908d6ad820d57a1ae25794231f77e74b" }
waterui-testing = { git = "https://github.com/water-rs/waterui", rev = "4dacae48908d6ad820d57a1ae25794231f77e74b" }
waterui-text = { git = "https://github.com/water-rs/waterui", rev = "4dacae48908d6ad820d57a1ae25794231f77e74b" }
waterui-url = { git = "https://github.com/water-rs/waterui", rev = "4dacae48908d6ad820d57a1ae25794231f77e74b" }
waterui-video = { git = "https://github.com/water-rs/waterui", rev = "4dacae48908d6ad820d57a1ae25794231f77e74b" }
waterui-watcher-set = { git = "https://github.com/water-rs/waterui", rev = "4dacae48908d6ad820d57a1ae25794231f77e74b" }
waterui-webview = { git = "https://github.com/water-rs/waterui", rev = "4dacae48908d6ad820d57a1ae25794231f77e74b" }

# Extracted component crates at the revisions the framework's own patch
# table pins at 4dacae48; `waterui-canvas` itself is the local crate,
# patched at the top of the table.
waterui-barcode = { git = "https://github.com/water-rs/barcode", rev = "491ada1c7db31bdab657135338a5bd670adbe61f" }
waterui-chart = { git = "https://github.com/water-rs/chart", rev = "bc1ffc4cf0cc4884b6104883f2c537e246ba2c7e" }
waterui-image = { git = "https://github.com/water-rs/image", rev = "87080fc2e06628eb990af9fdbfbc3b8a28af5acc" }
waterui-map-gpu = { git = "https://github.com/water-rs/map-gpu", rev = "add3782ece2c48db44f28873dd6e2ce63e50cf9f" }
waterui-math = { git = "https://github.com/water-rs/math", rev = "878bfc0284b32ee18c1a50860adf9ba489a4d5ab" }
waterui-particle = { git = "https://github.com/water-rs/particle", rev = "b07a8e7a950a4590c475edb65dc7abd967f7d820" }
waterui-svg = { git = "https://github.com/water-rs/svg", rev = "50a87217658e9cf40024bf50619c4d7555a6415b" }
waterui-video-gpu = { git = "https://github.com/water-rs/video-gpu", rev = "4f95775bcef3022e6d5a52c2aa09aee02afb628f" }

# The mounted test graph's backend pair at the revisions the framework's
# own patch table pins: `hydrolysis` lives in-tree at `backends/hydrolysis`
# (water-rs/waterui#1428), so it resolves from the same framework revision
# as every `waterui-*` crate; its Material 3 theme is still external and
# rides the rev the framework pins.
hydrolysis = { git = "https://github.com/water-rs/waterui", rev = "4dacae48908d6ad820d57a1ae25794231f77e74b" }
hydrolysis-m3 = { git = "https://github.com/water-rs/hydrolysis-m3", rev = "169c42a810c4662abda184c89c114846877b13ec" }

# nami#26 renames `Signal::get` to `Signal::snapshot`; drop once released.
nami = { git = "https://github.com/water-rs/nami", rev = "f1db5017f5d64cb45b9b304c74ff420377258476" }
nami-core = { git = "https://github.com/water-rs/nami", rev = "f1db5017f5d64cb45b9b304c74ff420377258476" }

# The Cherenkov cutover (water-rs/hydrolysis#205), now in-tree: the engine
# moved into water-rs/waterui under `graphics/` (water-rs/waterui#1449), and
# the stand-alone cherenkov repository is no longer the source. Its filtrate
# members are the filter library `.filter(F)`/`.effect(E)` and the engine
# agree on — every filtrate in the graph must come from this same revision
# or a filter built on one side is a different type on the other.
cherenkov = { git = "https://github.com/water-rs/waterui", rev = "4dacae48908d6ad820d57a1ae25794231f77e74b" }
cherenkov-cpu = { git = "https://github.com/water-rs/waterui", rev = "4dacae48908d6ad820d57a1ae25794231f77e74b" }
cherenkov-gpu = { git = "https://github.com/water-rs/waterui", rev = "4dacae48908d6ad820d57a1ae25794231f77e74b" }
filtrate = { git = "https://github.com/water-rs/waterui", rev = "4dacae48908d6ad820d57a1ae25794231f77e74b" }
filtrate-core = { git = "https://github.com/water-rs/waterui", rev = "4dacae48908d6ad820d57a1ae25794231f77e74b" }
filtrate-derive = { git = "https://github.com/water-rs/waterui", rev = "4dacae48908d6ad820d57a1ae25794231f77e74b" }

