[package]
name = "waterui-canvas"
version = "0.1.1"
edition = "2024"
rust-version = "1.95"
authors = ["Lexo Liu <me@lexo.cool>"]
license = "Apache-2.0 OR MIT"
readme = "README.md"
repository = "https://github.com/water-rs/canvas"
description = "Canvas 2D vector graphics for WaterUI using Vello"
keywords = ["canvas", "2d", "graphics", "waterui", "vello"]
categories = ["gui"]

[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
multiple_crate_versions = "allow"

[features]
default = ["image"]
# Raster images on the canvas: `CanvasImage`, the `draw_image*` family and the
# `CanvasResource::Image` arm.
#
# Decoding goes through `waterui-graphics`'s `image_decode`, which that crate
# gates behind its `gpu` feature, so asking for images here is what pulls the
# whole wgpu stack in. Vector drawing needs none of it: a consumer that never
# draws a decoded image — a CPU-only renderer such as a dew firmware build —
# turns this feature off and links neither the codecs nor wgpu.
image = ["dep:image", "waterui-graphics/gpu"]

[dependencies]
waterui-core = "0.3.0"
waterui-graphics = { version = "0.4.0", default-features = false }
nami = "0.11.0"
kurbo = "0.13"
peniko = "0.6"
parley = { version = "0.11", default-features = false, features = ["system"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff"], optional = true }

[dev-dependencies]
waterui = "0.4.0"
# The scene-engine test renders a canvas through a real GPU runtime, so the
# tests need the engine-backed half of the graphics crate even when the crate
# under test is built without it.
waterui-graphics = { version = "0.4.0", features = ["gpu"] }
waterui-testing = "0.4.0"
pollster = "1.0"
wgpu = "29.0.4"

[patch.crates-io]
# Tests and examples link the framework; every workspace crate comes from the
# same monorepo commit so the graph carries exactly one copy of each.
waterui-canvas = { path = "." }
hydrolysis = { git = "https://github.com/water-rs/waterui.git", rev = "c6df302408b42f18be1ea7692d0438973f1e0e62" }
hydrolysis-m3 = { git = "https://github.com/water-rs/waterui.git", rev = "c6df302408b42f18be1ea7692d0438973f1e0e62" }
waterui = { git = "https://github.com/water-rs/waterui.git", rev = "c6df302408b42f18be1ea7692d0438973f1e0e62" }
