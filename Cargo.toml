[package]
name = "waterui-canvas"
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
authors = ["Lexo Liu <me@lexo.cool>"]
license = "Apache-2.0 OR MIT"
readme = "README.md"
repository = "https://github.com/water-rs/canvas"
description = "Canvas 2D vector graphics for WaterUI using Vello"
keywords = ["canvas", "2d", "graphics", "waterui", "vello"]
categories = ["gui"]

[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
multiple_crate_versions = "allow"

[features]
default = ["image"]
# Raster images on the canvas: `CanvasImage`, the `draw_image*` family and the
# `CanvasResource::Image` arm.
#
# Decoding goes through `waterui-graphics`'s `image_decode`, which that crate
# gates behind its `gpu` feature, so asking for images here is what pulls the
# whole wgpu stack in. Vector drawing needs none of it: a consumer that never
# draws a decoded image — a CPU-only renderer such as a dew firmware build —
# turns this feature off and links neither the codecs nor wgpu.
image = ["dep:image", "waterui-graphics/gpu"]

# The requirements below are the versions the pinned framework revision
# declares; they move to 0.5.0 when the `[patch.crates-io]` pins drop after the
# release. A "0.5.0" requirement cannot resolve before the wave is on
# crates.io — cargo checks a patch's declared version against the requirement.
[dependencies]
waterui-core = "0.5.0"
waterui-graphics = { version = "0.5.0", default-features = false }
nami = "0.11.2"
kurbo = "0.13"
peniko = "0.6"
parley = { version = "0.11", default-features = false, features = ["system"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff"], optional = true }

[dev-dependencies]
waterui = "0.5.0"
# The scene-engine test renders a canvas through a real GPU runtime, so the
# tests need the engine-backed half of the graphics crate even when the crate
# under test is built without it.
waterui-graphics = { version = "0.5.0", features = ["gpu"] }
waterui-testing = "0.5.0"
pollster = "1.0"
wgpu = "29.0.4"

# Third-party forks the framework itself patches; a registry dependency does
# not carry its own patch table, so they are repeated here so this graph
# resolves the same sources as water-rs/waterui `dev`.
[patch.crates-io]
xcb = { git = "https://github.com/rust-x-bindings/rust-xcb", rev = "ae3b2cd080e78173223038ccbebdc644eaf4a9ad" }
vello = { git = "https://github.com/lexoliu/vello", rev = "5e5f538556be16527f67379b105af82f408b747d" }
vello_hybrid = { git = "https://github.com/lexoliu/vello", rev = "d68d9e9825bcd1ffee762323881c13a2e7a3f639" }
vello_common = { git = "https://github.com/lexoliu/vello", rev = "d68d9e9825bcd1ffee762323881c13a2e7a3f639" }
vello_sparse_shaders = { git = "https://github.com/lexoliu/vello", rev = "d68d9e9825bcd1ffee762323881c13a2e7a3f639" }
glifo = { git = "https://github.com/lexoliu/vello", rev = "d68d9e9825bcd1ffee762323881c13a2e7a3f639" }