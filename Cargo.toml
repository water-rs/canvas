[package]
name = "waterui-canvas"
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
authors = ["Lexo Liu <me@lexo.cool>"]
license = "Apache-2.0 OR MIT"
readme = "README.md"
repository = "https://github.com/water-rs/canvas"
description = "Canvas 2D vector graphics for WaterUI on the Cherenkov engine"
keywords = ["canvas", "2d", "graphics", "waterui", "cherenkov"]
categories = ["gui"]

[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
multiple_crate_versions = "allow"

[features]
default = ["image"]
# Raster images on the canvas: `CanvasImage`, the `draw_image*` family and the
# `CanvasResource::Image` arm.
#
# Decoding goes through `waterui-graphics`'s `image_decode`, which that crate
# gates behind its `gpu` feature, so asking for images here is what pulls the
# whole wgpu stack in. Vector drawing needs none of it: a consumer that never
# draws a decoded image — a CPU-only renderer such as a dew firmware build —
# turns this feature off and links neither the codecs nor wgpu.
image = ["dep:image", "waterui-graphics/gpu"]

# The requirements below are the versions the pinned framework revision
# declares; they move to 0.5.x when the `[patch.crates-io]` pins drop after the
# release. A lower requirement cannot resolve to a newer patch — cargo checks
# a patch's declared version against the requirement.
[dependencies]
waterui-core = "0.5.1"
waterui-graphics = { version = "0.5.1", default-features = false }
nami = "0.12"
kurbo = "0.13"
parley = { version = "0.11", default-features = false, features = ["system"] }
tracing = "0.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff"], optional = true }

[dev-dependencies]
# The scene-engine test renders a canvas through the Cherenkov GPU engine and
# the CPU raster engine, so the tests need the engine-backed half of the
# graphics crate even when the crate under test is built without it.
waterui-graphics = { version = "0.5.1", features = ["gpu", "cpu"] }
# The mounted end-to-end test exercises the real view mounting path and the
# accessibility tree; both come from the facade and its testing harness. Until
# the hydrolysis port lands they are the targets that do not build.
waterui = "0.5.2"
waterui-testing = "0.5.1"

[patch.crates-io]
# The crate under test stands in for the published `waterui-canvas` the facade
# and testing harness ask for.
waterui-canvas = { path = "." }

# Third-party forks the framework itself patches; a registry dependency does
# not carry its own patch table, so the ones this graph resolves are repeated
# here so it builds the same sources as water-rs/waterui at the pinned rev.
xcb = { git = "https://github.com/rust-x-bindings/rust-xcb", rev = "ae3b2cd080e78173223038ccbebdc644eaf4a9ad" }
block = { git = "https://github.com/Dicklesworthstone/rust-block", rev = "b39ae859d1ee8e8cb5eef6a516471f1578d26b96" }

# The framework head the crate builds against: water-rs/waterui at cc756f574,
# the `deps/1832-nami-0.12` head that moves the framework to nami 0.12 /
# nami-core 0.4 from crates.io (water-rs/waterui#1832) on top of the
# render-target-neutral recording contract (water-rs/waterui#1435):
# `SceneContent::build_scene` records into `waterui_graphics::draw`
# (`cherenkov_record::Recorder`) and `SceneResources::new` takes the target's
# `SceneBackend`/`ShaderBackend` registry instead of `Rc<Engine<B>>`. Every
# `waterui-*` crate in the graph must resolve to this one rev — a registry
# `waterui-core` beside the facade's own path dependencies gives two `View`
# traits in one graph.
waterui = { git = "https://github.com/water-rs/waterui", rev = "cc756f5745eb8841d33e54c7305d00c8e616a32e" }
waterui-assets = { git = "https://github.com/water-rs/waterui", rev = "cc756f5745eb8841d33e54c7305d00c8e616a32e" }
waterui-assets-core = { git = "https://github.com/water-rs/waterui", rev = "cc756f5745eb8841d33e54c7305d00c8e616a32e" }
waterui-assets-macros = { git = "https://github.com/water-rs/waterui", rev = "cc756f5745eb8841d33e54c7305d00c8e616a32e" }
waterui-assets-planner = { git = "https://github.com/water-rs/waterui", rev = "cc756f5745eb8841d33e54c7305d00c8e616a32e" }
waterui-backend-core = { git = "https://github.com/water-rs/waterui", rev = "cc756f5745eb8841d33e54c7305d00c8e616a32e" }
waterui-controls = { git = "https://github.com/water-rs/waterui", rev = "cc756f5745eb8841d33e54c7305d00c8e616a32e" }
waterui-core = { git = "https://github.com/water-rs/waterui", rev = "cc756f5745eb8841d33e54c7305d00c8e616a32e" }
waterui-dylib = { git = "https://github.com/water-rs/waterui", rev = "cc756f5745eb8841d33e54c7305d00c8e616a32e" }
waterui-form = { git = "https://github.com/water-rs/waterui", rev = "cc756f5745eb8841d33e54c7305d00c8e616a32e" }
waterui-graphics = { git = "https://github.com/water-rs/waterui", rev = "cc756f5745eb8841d33e54c7305d00c8e616a32e" }
waterui-icon = { git = "https://github.com/water-rs/waterui", rev = "cc756f5745eb8841d33e54c7305d00c8e616a32e" }
waterui-inspector-protocol = { git = "https://github.com/water-rs/waterui", rev = "cc756f5745eb8841d33e54c7305d00c8e616a32e" }
waterui-internal = { git = "https://github.com/water-rs/waterui", rev = "cc756f5745eb8841d33e54c7305d00c8e616a32e" }
waterui-layout = { git = "https://github.com/water-rs/waterui", rev = "cc756f5745eb8841d33e54c7305d00c8e616a32e" }
waterui-locale = { git = "https://github.com/water-rs/waterui", rev = "cc756f5745eb8841d33e54c7305d00c8e616a32e" }
waterui-macros = { git = "https://github.com/water-rs/waterui", rev = "cc756f5745eb8841d33e54c7305d00c8e616a32e" }
waterui-map = { git = "https://github.com/water-rs/waterui", rev = "cc756f5745eb8841d33e54c7305d00c8e616a32e" }
waterui-media = { git = "https://github.com/water-rs/waterui", rev = "cc756f5745eb8841d33e54c7305d00c8e616a32e" }
waterui-navigation = { git = "https://github.com/water-rs/waterui", rev = "cc756f5745eb8841d33e54c7305d00c8e616a32e" }
waterui-preview-protocol = { git = "https://github.com/water-rs/waterui", rev = "cc756f5745eb8841d33e54c7305d00c8e616a32e" }
waterui-shape = { git = "https://github.com/water-rs/waterui", rev = "cc756f5745eb8841d33e54c7305d00c8e616a32e" }
waterui-testing = { git = "https://github.com/water-rs/waterui", rev = "cc756f5745eb8841d33e54c7305d00c8e616a32e" }
waterui-text = { git = "https://github.com/water-rs/waterui", rev = "cc756f5745eb8841d33e54c7305d00c8e616a32e" }
waterui-url = { git = "https://github.com/water-rs/waterui", rev = "cc756f5745eb8841d33e54c7305d00c8e616a32e" }
waterui-video = { git = "https://github.com/water-rs/waterui", rev = "cc756f5745eb8841d33e54c7305d00c8e616a32e" }
waterui-watcher-set = { git = "https://github.com/water-rs/waterui", rev = "cc756f5745eb8841d33e54c7305d00c8e616a32e" }
waterui-webview = { git = "https://github.com/water-rs/waterui", rev = "cc756f5745eb8841d33e54c7305d00c8e616a32e" }

# Extracted component crates. The ones moving to nami 0.12 alongside this
# crate (barcode, chart, map-gpu, math, video-gpu) ride the commit on their own
# nami 0.12 branches that changes only the package requirement, since the revisions the framework's table names
# are still on nami 0.11; image, particle and svg ride the revisions the
# framework's own patch table pins at cc756f574. `waterui-canvas` itself is
# the local crate, patched at the top of the table.
waterui-barcode = { git = "https://github.com/water-rs/barcode", rev = "d5ac6ff3d08dc8cd8c9c1cd457439ffe470b62a5" }
waterui-chart = { git = "https://github.com/water-rs/chart", rev = "54319cbc41cc624c3a662f22f3ab18eacd84fd8a" }
waterui-image = { git = "https://github.com/water-rs/image", rev = "8b1aa2ce3f03d81ca02164f5563f2cefc34fb566" }
waterui-map-gpu = { git = "https://github.com/water-rs/map-gpu", rev = "85f64a55f531738049a4188ffec544501b1a15b0" }
waterui-math = { git = "https://github.com/water-rs/math", rev = "ac384386f03634799865b6766eb3f03ae3f83248" }
waterui-particle = { git = "https://github.com/water-rs/particle", rev = "4364f1ece5373bf322ea99cde595d7b4ec6958dc" }
waterui-svg = { git = "https://github.com/water-rs/svg", rev = "16f99e021f735d0b1b31c95552b074e953d56418" }
waterui-video-gpu = { git = "https://github.com/water-rs/video-gpu", rev = "b32b6f2a3cbd114ce622a91a6f4c7e4f1c1d98b3" }

# The mounted test graph's backend pair at the revisions the framework's
# own patch table pins: `hydrolysis` lives in-tree at `backends/hydrolysis`
# (water-rs/waterui#1428), so it resolves from the same framework revision
# as every `waterui-*` crate; its Material 3 theme is still external and
# rides the rev the framework pins.
hydrolysis = { git = "https://github.com/water-rs/waterui", rev = "cc756f5745eb8841d33e54c7305d00c8e616a32e" }
hydrolysis-m3 = { git = "https://github.com/water-rs/hydrolysis-m3", rev = "bc412a1a7e796cedc30d2c62d33fe293634574a8" }

# suiteki 0.1.1 on crates.io implements nami-core 0.3's `Signal`; suiteki dev
# at the merge of water-rs/suiteki#27 implements 0.4's, the rev the
# framework's own patch table pins. Drop once a release carries it.
suiteki = { git = "https://github.com/water-rs/suiteki", rev = "7cf17bdba0e978d388a096b1916daebdc17253b4" }

# The Cherenkov cutover (water-rs/hydrolysis#205), now in-tree: the engine
# moved into water-rs/waterui under `graphics/` (water-rs/waterui#1449), and
# the stand-alone cherenkov repository is no longer the source. Its filtrate
# members are the filter library `.filter(F)`/`.effect(E)` and the engine
# agree on — every filtrate in the graph must come from this same revision
# or a filter built on one side is a different type on the other.
cherenkov = { git = "https://github.com/water-rs/waterui", rev = "cc756f5745eb8841d33e54c7305d00c8e616a32e" }
cherenkov-cpu = { git = "https://github.com/water-rs/waterui", rev = "cc756f5745eb8841d33e54c7305d00c8e616a32e" }
cherenkov-gpu = { git = "https://github.com/water-rs/waterui", rev = "cc756f5745eb8841d33e54c7305d00c8e616a32e" }
filtrate = { git = "https://github.com/water-rs/waterui", rev = "cc756f5745eb8841d33e54c7305d00c8e616a32e" }
filtrate-core = { git = "https://github.com/water-rs/waterui", rev = "cc756f5745eb8841d33e54c7305d00c8e616a32e" }
filtrate-derive = { git = "https://github.com/water-rs/waterui", rev = "cc756f5745eb8841d33e54c7305d00c8e616a32e" }

